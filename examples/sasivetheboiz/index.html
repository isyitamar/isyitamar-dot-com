    #splash-screen {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.065), transparent 31%),
        radial-gradient(circle at 0% 50%, rgba(70, 120, 205, 0.16), transparent 32%),
        radial-gradient(circle at 100% 55%, rgba(72, 125, 210, 0.14), transparent 34%),
        radial-gradient(circle at 18% 14%, rgba(142, 82, 128, 0.055), transparent 28%),
        linear-gradient(135deg, #020308, #090f1b 56%, #030406);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
      transition: opacity 0.48s ease-out;
      overflow: hidden;
    }

    .splash-logo-wrap {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      z-index: 2;
      animation: splashLogoFlash 1.45s cubic-bezier(.18, 1.15, .32, 1) forwards;
      opacity: 0;
      box-shadow:
        0 0 0 8px rgba(255,255,255,0.055),
        0 0 42px rgba(255,255,255,0.31),
        0 0 86px rgba(83, 130, 220, 0.20);
    }

    .splash-logo-wrap::before {
      content: "";
      position: absolute;
      top: -10%;
      left: -75%;
      width: 54%;
      height: 125%;
      background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.0) 20%, rgba(255,255,255,0.97) 48%, rgba(255,255,255,0.28) 58%, transparent 78%);
      filter: blur(1.5px);
      transform: rotate(-38deg);
      animation: logoInnerShine 1.05s ease-out forwards;
      z-index: 4;
      pointer-events: none;
    }

    .splash-logo-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.72);
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 2;
    }


    #splash-screen::after {
      content: "";
      position: absolute;
      width: 152px;
      height: 152px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 0 44px rgba(255,255,255,0.18), inset 0 0 26px rgba(255,255,255,0.05);
      animation: splashSoftRing 1.45s ease-out forwards;
      z-index: 1;
    }

    @keyframes fadeInElement {
      from { opacity: 0; transform: scale(0.82); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes splashLogoFlash {
      0% { opacity: 0; transform: scale(0.78); filter: brightness(0.8); }
      38% { opacity: 1; transform: scale(1); filter: brightness(1.15); }
      62% { opacity: 1; transform: scale(1.18); filter: brightness(1.85); }
      82% { opacity: 1; transform: scale(1); filter: brightness(1.05); }
      100% { opacity: 0; transform: scale(0.98); filter: brightness(1); }
    }


    @keyframes logoInnerShine {
      0% { opacity: 0; left: -75%; }
      18% { opacity: 1; }
      68% { opacity: 1; left: 118%; }
      100% { opacity: 0; left: 132%; }
    }

    @keyframes splashSoftRing {
      0% { opacity: 0; transform: scale(0.78); }
      55% { opacity: 0.8; transform: scale(1.08); }
      100% { opacity: 0; transform: scale(1.22); }
    }

<script>
    const spotlight = document.getElementById('spotlight');
    const readingGuide = document.getElementById('reading-guide');
    const mainContent = document.getElementById('main-page-content');
    const splash = document.getElementById('splash-screen');
    const kickStatus = document.getElementById('kick-live-status');
    const navTabs = document.getElementById('nav-tabs');
    const pageBadge = document.getElementById('page-badge');
    const tabButtons = document.querySelectorAll('.nav-tab');
    const pageSections = document.querySelectorAll('.page-section');
    document.body.dataset.page = 'home';

    document.addEventListener('mousemove', (e) => {
      if (spotlight) {
        spotlight.style.left = e.clientX + 'px';
        spotlight.style.top = e.clientY + 'px';

        const x = e.clientX / Math.max(window.innerWidth, 1);
        const y = e.clientY / Math.max(window.innerHeight, 1);
        const pinkPower = Math.max(0, 1 - Math.hypot(x - 0.18, y - 0.14) * 2.6);
        const leftBluePower = Math.max(0, 1 - Math.hypot(x - 0.02, y - 0.50) * 2.15);
        const rightBluePower = Math.max(0, 1 - Math.hypot(x - 0.98, y - 0.55) * 2.15);
        const bluePower = Math.max(leftBluePower, rightBluePower);
        const whitePower = Math.max(0, 1 - Math.hypot(x - 0.50, y - 0.72) * 1.65);

        const r = Math.round(122 + pinkPower * 54 + whitePower * 60 - bluePower * 18);
        const g = Math.round(140 + bluePower * 44 + whitePower * 64);
        const b = Math.round(185 + bluePower * 58 + whitePower * 54 - pinkPower * 12);
        const a = 0.13 + Math.max(pinkPower, bluePower, whitePower) * 0.11;
        document.documentElement.style.setProperty('--spotlight-color', `rgba(${r}, ${g}, ${b}, ${a.toFixed(2)})`);
      }

      if (document.body.classList.contains('a11y-reading-guide') && readingGuide) {
        readingGuide.style.top = e.clientY + 'px';
      }
    });

    function bounceNavTabs() {
      if (!navTabs) return;
      navTabs.classList.remove('bubble-in');
      void navTabs.offsetWidth;
      navTabs.classList.add('bubble-in');
    }

    function animateActiveItems() {
      const activeSection = document.querySelector('.page-section.active');
      if (!activeSection) return;

      const items = activeSection.querySelectorAll('.animated-item');

      items.forEach((item, index) => {
        item.classList.remove('item-animate');
        item.style.animationDelay = `${index * 90}ms`;
        void item.offsetWidth;
        item.classList.add('item-animate');
      });
    }

    function switchPage(pageName) {
      document.body.dataset.page = pageName;
      pageSections.forEach(section => {
        section.classList.remove('active');
      });

      tabButtons.forEach(button => {
        button.classList.toggle('active', button.dataset.page === pageName);
      });

      const nextSection = document.getElementById(`${pageName}-section`);
      if (nextSection) nextSection.classList.add('active');

      if (pageBadge) {
        if (pageName === 'info') pageBadge.textContent = 'Kick Commands';
        else if (pageName === 'leaderboard') pageBadge.textContent = 'LeaderBoard';
        else if (pageName === 'privacy') pageBadge.textContent = 'Privacy Policy';
        else if (pageName === 'accessibility') pageBadge.textContent = 'Accessibility Statement';
        else pageBadge.textContent = 'Official Links';
      }

      const currentFontSize = Number(document.getElementById('font-size-control')?.value || 100);
      document.body.classList.toggle(
        'a11y-scroll',
        currentFontSize > 100 || pageName === 'privacy' || pageName === 'accessibility'
      );

      if (pageName === 'leaderboard') {
        loadLeaderboards();
      }
    }

    document.querySelectorAll('[data-page]').forEach(button => {
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        switchPage(button.dataset.page);
      });
    });



    // External links always keep their normal browser navigation.
    document.querySelectorAll('a[href]').forEach(link => {
      link.addEventListener('click', (event) => {
        event.stopPropagation();
        // Intentionally NO preventDefault here.
      });
    });

    function activateSite() {
      if (splash) splash.style.opacity = '0';

      setTimeout(() => {
        if (splash) splash.style.display = 'none';
        if (mainContent) mainContent.classList.add('visible');
        if (spotlight) spotlight.style.display = 'block';
        bounceNavTabs();
        animateActiveItems();
      }, 400);
    }

    setTimeout(activateSite, 1500);

    let kickIsLive = false;

    function setKickStatus(isLive) {
      kickIsLive = Boolean(isLive);
      const profileLiveDot = document.getElementById('profile-live-dot');
      const kickHomeCard = document.getElementById('kick-home-card');
      const graphLivePill = document.getElementById('kick-graph-live-pill');

      if (kickStatus) {
        const text = kickStatus.querySelector('.status-text');
        kickStatus.classList.remove('status-live', 'status-offline');

        if (kickIsLive) {
          kickStatus.classList.add('status-live');
          if (text) text.textContent = 'on Live';
        } else {
          kickStatus.classList.add('status-offline');
          if (text) text.textContent = 'offline';
        }
      }

      if (profileLiveDot) profileLiveDot.classList.toggle('live', kickIsLive);
      if (kickHomeCard) kickHomeCard.classList.toggle('live-led', kickIsLive);
      if (graphLivePill) {
        graphLivePill.textContent = kickIsLive ? 'LIVE' : 'OFFLINE';
        graphLivePill.classList.toggle('live', kickIsLive);
      }
    }

    function checkIfLiveFromData(data) {
      const live =
        data?.livestream ||
        data?.current_livestream ||
        data?.stream ||
        null;

      if (!live) return false;
      if (live.is_live === true) return true;
      if (live.is_live === false) return false;

      // Some unauthenticated Kick payloads omit is_live but include a current
      // start_time only while a live stream is active.
      return Boolean(live.start_time || live.started_at);
    }

    async function fetchJsonWithFallback(url) {
      const urlsToTry = [
        url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url)
      ];

      for (const currentUrl of urlsToTry) {
        try {
          const response = await fetch(currentUrl, { cache: 'no-store' });
          if (!response.ok) continue;
          return await response.json();
        } catch (error) {
          console.log('Fetch JSON failed:', currentUrl, error);
        }
      }

      throw new Error('Could not fetch JSON');
    }

    async function fetchTextWithFallback(url) {
      const urlsToTry = [
        url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent(url),
        'https://corsproxy.io/?' + encodeURIComponent(url),
        'https://r.jina.ai/http://r.jina.ai/http://'.replace('http://r.jina.ai/http://', '') + url,
        'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://r.jina.ai/' + url)
      ];

      for (const currentUrl of urlsToTry) {
        try {
          const response = await fetch(currentUrl, { cache: 'no-store' });
          if (!response.ok) continue;

          const text = await response.text();

          if (
            text &&
            text.length > 80 &&
            !text.toLowerCase().includes('internal server error') &&
            !text.toLowerCase().includes('bad gateway')
          ) {
            return text;
          }
        } catch (error) {
          console.log('Fetch text failed:', currentUrl, error);
        }
      }

      throw new Error('Could not fetch text');
    }

    document.getElementById('profile-live-dot')?.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      window.open('https://kick.com/sasivetheboiz', '_blank', 'noopener,noreferrer');
    });



    // ===== Lightweight Kick live-status refresh (statistics page removed) =====
    const KICK_SLUG = 'sasivetheboiz';
    const KICK_CHANNEL_URL = `https://kick.com/api/v2/channels/${KICK_SLUG}`;

    async function refreshKickStatusOnly() {
      try {
        const data = await fetchJsonWithFallback(KICK_CHANNEL_URL);
        setKickStatus(checkIfLiveFromData(data));
      } catch (error) {
        console.log('Kick live-status refresh failed:', error);
        setKickStatus(false);
      }
    }

    refreshKickStatusOnly();
    setInterval(refreshKickStatusOnly, 60000);

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function renderLeaderboardRows(tbodyId, rows, valueKey, emptyText) {
      const tbody = document.getElementById(tbodyId);
      if (!tbody) return;

      if (!rows || rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="leaderboard-empty">${emptyText}</td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = rows.map((row, index) => {
        const rawValue = row[valueKey] ?? row.value ?? 0;
        const displayValue = Number.isFinite(Number(rawValue))
          ? Number(rawValue).toLocaleString('en-US')
          : escapeHtml(rawValue);

        return `
        <tr>
          <td class="leaderboard-rank">${index + 1}</td>
          <td class="leaderboard-user">${escapeHtml(row.username || row.name || 'Unknown')}</td>
          <td class="leaderboard-value">${displayValue}</td>
        </tr>
      `;
      }).join('');
    }

    function parseBotrixWatchtime(html) {
      const results = [];
      const seenUsers = new Set();

      function addResult(username, watchtime) {
        if (!username || !watchtime) return;

        username = String(username).trim();
        watchtime = String(watchtime).trim();

        if (!username || !watchtime) return;

        const low = username.toLowerCase();

        if (
          seenUsers.has(low) ||
          /botrix|leaderboard|watchtime|position|points|messages|level|name|search|ranking/i.test(username)
        ) {
          return;
        }

        seenUsers.add(low);

        results.push({
          username,
          watchtime
        });
      }

      const doc = new DOMParser().parseFromString(html, 'text/html');

      doc.querySelectorAll('table tr').forEach(row => {
        const cells = [...row.querySelectorAll('td, th')]
          .map(cell => cell.innerText.trim())
          .filter(Boolean);

        if (cells.length >= 3) {
          const watchtime = cells.find(cell =>
            /\b\d+\s*d\b|\b\d+\s*h\b|\b\d+\s*m\b|\b\d+\s*min\b|hours?|minutes?|days?/i.test(cell)
          );

          const username = cells.find(cell =>
            cell !== watchtime &&
            !/^#?\d+$/.test(cell) &&
            !/position|messages|level|points|watchtime|name|זמן|צפייה/i.test(cell)
          );

          addResult(username, watchtime);
        }
      });

      if (results.length > 0) return results.slice(0, 10);

      const rawText = (doc.body?.innerText || html)
        .replace(/\r/g, '\n')
        .replace(/[ \t]+/g, ' ')
        .replace(/\n{2,}/g, '\n')
        .trim();

      const compactText = rawText.replace(/\s+/g, ' ');

      const patterns = [
        /Position\s*#?\s*(\d+)[\s\S]{0,80}?Name\s+([A-Za-z0-9_.\-\u0590-\u05FF]+)[\s\S]{0,280}?Watchtime\s+((?:\d+\s*d\s*)?(?:\d+\s*h\s*)?(?:\d+\s*(?:m|min))?)/gi,
        /#\s*(\d+)\s+([A-Za-z0-9_.\-\u0590-\u05FF]+)\s+((?:\d+\s*d\s*)?(?:\d+\s*h\s*)?(?:\d+\s*(?:m|min)))/gi,
        /([A-Za-z0-9_.\-\u0590-\u05FF]+)\s+((?:\d+\s*d\s*)?(?:\d+\s*h\s*)?(?:\d+\s*(?:m|min)))/gi
      ];

      for (const regex of patterns) {
        let match;

        while ((match = regex.exec(compactText)) !== null) {
          let username;
          let watchtime;

          if (match.length === 4) {
            username = match[2];
            watchtime = match[3];
          } else {
            username = match[1];
            watchtime = match[2];
          }

          addResult(username, watchtime);

          if (results.length >= 10) break;
        }

        if (results.length > 0) break;
      }

      return results.slice(0, 10);
    }

    async function loadWatchtimeLeaderboard() {
      try {
        const html = await fetchTextWithFallback('https://botrix.live/k/sasivetheboiz/leaderboard');
        const rows = parseBotrixWatchtime(html);

        renderLeaderboardRows(
          'watchtime-leaderboard-body',
          rows,
          'watchtime',
          'אין נתוני זמן צפייה כרגע'
        );
      } catch (error) {
        console.log('Could not load BotRix leaderboard:', error);

        renderLeaderboardRows(
          'watchtime-leaderboard-body',
          [],
          'watchtime',
          'אין נתוני זמן צפייה כרגע'
        );
      }
    }

    function findGifters(data) {
      const possibleArrays = [];

      function scan(value, keyName = '') {
        if (!value) return;

        if (Array.isArray(value)) {
          const key = keyName.toLowerCase();

          if (
            key.includes('gift') ||
            key.includes('gifter') ||
            key.includes('gifts') ||
            key.includes('leader') ||
            key.includes('rank')
          ) {
            possibleArrays.push(value);
          }

          value.forEach(item => scan(item, keyName));
          return;
        }

        if (typeof value === 'object') {
          Object.entries(value).forEach(([key, val]) => {
            scan(val, key);
          });
        }
      }

      scan(data);

      const bestArray = possibleArrays.find(arr =>
        arr.some(item => {
          const text = JSON.stringify(item).toLowerCase();
          return (
            text.includes('quantity') ||
            text.includes('count') ||
            text.includes('gift') ||
            text.includes('amount') ||
            text.includes('username') ||
            text.includes('user')
          );
        })
      );

      if (!bestArray) return [];

      return bestArray
        .map(item => {
          const userObject = item.user || item.sender || item.gifter || item.viewer || item.profile || {};

          const username =
            item.username ||
            item.name ||
            item.user_name ||
            item.slug ||
            userObject.username ||
            userObject.name ||
            userObject.slug ||
            null;

          const quantity =
            item.quantity ||
            item.count ||
            item.gifts ||
            item.amount ||
            item.total ||
            item.value ||
            item.gift_count ||
            item.gifted_subs ||
            null;

          return {
            username,
            quantity
          };
        })
        .filter(item => item.username && item.quantity !== null && item.quantity !== undefined)
        .sort((a, b) => Number(b.quantity) - Number(a.quantity))
        .slice(0, 10);
    }

    async function loadGiftersLeaderboard() {
      const urlsToTry = [
        'https://kick.com/api/v2/channels/sasivetheboiz/leaderboards',
        'https://kick.com/api/v2/channels/sasivetheboiz/leaderboard',
        'https://kick.com/api/v2/channels/sasivetheboiz/gifts/leaderboard',
        'https://kick.com/api/v2/channels/sasivetheboiz'
      ];

      for (const url of urlsToTry) {
        try {
          const data = await fetchJsonWithFallback(url);
          const rows = findGifters(data);

          if (rows.length > 0) {
            renderLeaderboardRows(
              'gifters-leaderboard-body',
              rows,
              'quantity',
              'אין נתוני גיפטרים כרגע'
            );
            return;
          }
        } catch (error) {
          console.log('Kick gifters endpoint failed:', url, error);
        }
      }

      renderLeaderboardRows(
        'gifters-leaderboard-body',
        [],
        'quantity',
        'אין נתוני גיפטרים כרגע'
      );
    }

    function findKicks(data) {
      const lifetime =
        data?.data?.kicks_gifts_lifetime ||
        data?.kicks_gifts_lifetime ||
        data?.data?.lifetime ||
        data?.lifetime ||
        data?.data?.all_time ||
        data?.all_time ||
        data?.kicks?.lifetime ||
        [];

      if (!Array.isArray(lifetime)) return [];

      return lifetime
        .map(item => ({
          username: item.username || item.user_name || item.name || item.user?.username || null,
          quantity: item.gifted_amount ?? item.amount ?? item.quantity ?? item.total ?? item.count ?? null
        }))
        .filter(item => item.username && item.quantity !== null)
        .sort((a, b) => Number(b.quantity) - Number(a.quantity))
        .slice(0, 10);
    }

    async function loadKicksLeaderboard() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 8000);

      try {
        const response = await fetch(
          'https://r.jina.ai/http://web.kick.com/api/v1/kicks/6797876/leaderboard',
          {
            method: 'GET',
            headers: { Accept: 'application/json' },
            cache: 'no-store',
            signal: controller.signal
          }
        );

        if (!response.ok) throw new Error(`Kick API returned ${response.status}`);

        const proxyPayload = await response.json();
        const kickPayload = typeof proxyPayload?.data?.content === 'string'
          ? JSON.parse(proxyPayload.data.content)
          : proxyPayload;
        const rows = findKicks(kickPayload);
        if (!rows.length) throw new Error('Kick API returned no lifetime KICKers');

        renderLeaderboardRows(
          'kicks-leaderboard-body',
          rows,
          'quantity',
          'אין נתוני KICKs כרגע'
        );
      } catch (error) {
        console.log('Kick KICKers refresh was unavailable:', error);

        const tbody = document.getElementById('kicks-leaderboard-body');
        if (tbody && !tbody.querySelector('.leaderboard-user')) {
          tbody.innerHTML = `
            <tr>
              <td colspan="3" class="leaderboard-empty">לא ניתן לטעון כרגע נתונים חיים מ־Kick</td>
            </tr>
          `;
        }
      } finally {
        clearTimeout(timeout);
      }
    }

    let leaderboardsLoadedOnce = false;

    function loadLeaderboards() {
      loadGiftersLeaderboard();
      loadKicksLeaderboard();
      leaderboardsLoadedOnce = true;
    }

    setInterval(() => {
      if (leaderboardsLoadedOnce) {
        loadLeaderboards();
      }
    }, 30000);

    document.querySelectorAll('.copy-btn').forEach(button => {
      button.addEventListener('click', async () => {
        const command = button.dataset.copy;

        try {
          await navigator.clipboard.writeText(command);
        } catch (error) {
          const textarea = document.createElement('textarea');
          textarea.value = command;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          textarea.remove();
        }

        button.classList.add('copied');
        setTimeout(() => {
          button.classList.remove('copied');
        }, 900);
      });
    });

    const accessibilityButton = document.getElementById('accessibility-button');
    const a11yPanel = document.getElementById('a11y-panel');
    const readToggle = document.getElementById('read-toggle');
    const fontSizeControl = document.getElementById('font-size-control');
    const fontSizeValue = document.getElementById('font-size-value');
    const accentColorControl = document.getElementById('accent-color-control');
    const saturationToggle = document.getElementById('saturation-toggle');
    const grayscaleToggle = document.getElementById('grayscale-toggle');
    const underlineToggle = document.getElementById('underline-toggle');
    const motionToggle = document.getElementById('motion-toggle');
    const focusToggle = document.getElementById('focus-toggle');
    const lineHeightToggle = document.getElementById('line-height-toggle');
    const textSpacingToggle = document.getElementById('text-spacing-toggle');
    const readingGuideToggle = document.getElementById('reading-guide-toggle');
    const resetButton = document.getElementById('a11y-reset');
    const contrastButtons = document.querySelectorAll('[data-contrast]');

    let readEnabled = false;
    let lastSpokenText = '';
    let lastSpokenAt = 0;
    let hebrewVoice = null;

    function openA11yPanel() {
      a11yPanel.classList.add('open');
      a11yPanel.setAttribute('aria-hidden', 'false');
      accessibilityButton.setAttribute('aria-expanded', 'true');
    }

    function closeA11yPanel() {
      a11yPanel.classList.remove('open');
      a11yPanel.setAttribute('aria-hidden', 'true');
      accessibilityButton.setAttribute('aria-expanded', 'false');
    }

    function toggleA11yPanel() {
      if (a11yPanel.classList.contains('open')) {
        closeA11yPanel();
      } else {
        openA11yPanel();
      }
    }

    accessibilityButton.addEventListener('click', toggleA11yPanel);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeA11yPanel();
      }
    });

    document.addEventListener('click', (e) => {
      const clickedInsidePanel = a11yPanel.contains(e.target);
      const clickedButton = accessibilityButton.contains(e.target);

      if (!clickedInsidePanel && !clickedButton && a11yPanel.classList.contains('open')) {
        closeA11yPanel();
      }
    });

    function getHebrewVoice() {
      const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];

      const hebrewVoices = voices.filter(voice =>
        voice.lang.toLowerCase().includes('he') ||
        voice.lang.toLowerCase().includes('iw') ||
        voice.name.toLowerCase().includes('hebrew') ||
        voice.name.toLowerCase().includes('israel') ||
        voice.name.includes('עברית')
      );

      const maleHints = ['asaf', 'avri', 'david', 'moshe', 'amit', 'daniel', 'אסף', 'דוד', 'משה', 'דניאל', 'אברי'];

      hebrewVoice =
        hebrewVoices.find(voice => maleHints.some(hint => voice.name.toLowerCase().includes(hint))) ||
        hebrewVoices[0] ||
        voices[0] ||
        null;

      return hebrewVoice;
    }

    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = getHebrewVoice;
      getHebrewVoice();
    }

    function cleanTextForSpeech(text) {
      return text
        .replace(/\s+/g, ' ')
        .replace(/©/g, '')
        .replace(/⚙️|🔊/g, '')
        .trim()
        .slice(0, 170);
    }

    function speakText(text) {
      if (!readEnabled || !('speechSynthesis' in window)) return;

      const finalText = cleanTextForSpeech(text);
      if (!finalText) return;

      const now = Date.now();
      if (finalText === lastSpokenText && now - lastSpokenAt < 2200) return;

      lastSpokenText = finalText;
      lastSpokenAt = now;

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(finalText);
      utterance.lang = 'he-IL';
      utterance.rate = 0.92;
      utterance.pitch = 0.78;
      utterance.volume = 1;

      const voice = getHebrewVoice();
      if (voice) utterance.voice = voice;

      speechSynthesis.speak(utterance);
    }

    readToggle.addEventListener('click', () => {
      readEnabled = !readEnabled;

      if (readEnabled) {
        readToggle.classList.add('a11y-active');
        readToggle.textContent = '🔊 הקראה אוטומטית: פעיל';
        speakText('הקראה אוטומטית הופעלה');
      } else {
        readToggle.classList.remove('a11y-active');
        readToggle.textContent = '🔊 הקראה אוטומטית: כבוי';
        if ('speechSynthesis' in window) speechSynthesis.cancel();
      }
    });

    document.addEventListener('mouseover', (e) => {
      if (!readEnabled) return;

      const target = e.target.closest('a, button, label, input, h1, h2, h3, p, li, td, th, footer, [aria-label], [alt], .card, .command-card, .leaderboard-card, .privacy-section-box, .privacy-contact-box, .top-badge');
      if (!target) return;

      let text =
        target.getAttribute('aria-label') ||
        target.innerText ||
        target.getAttribute('alt') ||
        target.value ||
        '';

      if (target.tagName === 'INPUT') {
        const label = target.closest('.a11y-section')?.querySelector('.a11y-label span')?.innerText || '';
        text = label;
      }

      speakText(text);
    });

    fontSizeControl.addEventListener('input', () => {
      const value = fontSizeControl.value;
      document.documentElement.style.setProperty('--font-scale', value + '%');
      fontSizeValue.textContent = value + '%';
    });

    accentColorControl.addEventListener('input', () => {
      document.documentElement.style.setProperty('--accent-hue', accentColorControl.value);
      document.body.classList.add('a11y-accent-everything');
    });

    function clearContrastButtons() {
      contrastButtons.forEach(btn => btn.classList.remove('a11y-active'));
    }

    contrastButtons.forEach(button => {
      button.addEventListener('click', () => {
        const mode = button.getAttribute('data-contrast');

        document.body.classList.remove('a11y-contrast-dark', 'a11y-contrast-light');

        if (button.classList.contains('a11y-active')) {
          button.classList.remove('a11y-active');
          return;
        }

        clearContrastButtons();

        if (mode === 'dark') {
          document.body.classList.add('a11y-contrast-dark');
        }

        if (mode === 'light') {
          document.body.classList.add('a11y-contrast-light');
        }

        button.classList.add('a11y-active');
      });
    });

    saturationToggle.addEventListener('click', () => {
      saturationToggle.classList.toggle('a11y-active');

      if (saturationToggle.classList.contains('a11y-active')) {
        document.documentElement.style.setProperty('--a11y-saturation', '1.9');
      } else {
        document.documentElement.style.setProperty('--a11y-saturation', '1');
      }
    });

    grayscaleToggle.addEventListener('click', () => {
      grayscaleToggle.classList.toggle('a11y-active');

      if (grayscaleToggle.classList.contains('a11y-active')) {
        document.documentElement.style.setProperty('--a11y-grayscale', '1');
      } else {
        document.documentElement.style.setProperty('--a11y-grayscale', '0');
      }
    });

    underlineToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-underline-links');
      underlineToggle.classList.toggle('a11y-active');
    });

    motionToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-pause-motion');
      motionToggle.classList.toggle('a11y-active');
    });

    focusToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-focus-mode');
      focusToggle.classList.toggle('a11y-active');
    });

    lineHeightToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-line-height');
      lineHeightToggle.classList.toggle('a11y-active');
    });

    textSpacingToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-text-spacing');
      textSpacingToggle.classList.toggle('a11y-active');
    });

    readingGuideToggle.addEventListener('click', () => {
      document.body.classList.toggle('a11y-reading-guide');
      readingGuideToggle.classList.toggle('a11y-active');
    });

    resetButton.addEventListener('click', () => {
      readEnabled = false;
      if ('speechSynthesis' in window) speechSynthesis.cancel();

      readToggle.classList.remove('a11y-active');
      readToggle.textContent = '🔊 הקראה אוטומטית: כבוי';

      fontSizeControl.value = 100;
      fontSizeValue.textContent = '100%';
      document.documentElement.style.setProperty('--font-scale', '100%');

      accentColorControl.value = 176;
      document.documentElement.style.setProperty('--accent-hue', '176');

      document.documentElement.style.setProperty('--a11y-saturation', '1');
      document.documentElement.style.setProperty('--a11y-grayscale', '0');

      document.body.classList.remove(
        'a11y-contrast-dark',
        'a11y-contrast-light',
        'a11y-underline-links',
        'a11y-pause-motion',
        'a11y-focus-mode',
        'a11y-line-height',
        'a11y-text-spacing',
        'a11y-reading-guide',
        'a11y-accent-everything'
      );

      document.querySelectorAll('.a11y-active').forEach(btn => btn.classList.remove('a11y-active'));
    });

    // SasiVeTheBoiz title uses a fixed right-to-left dark-blue/white light flow.


    // ===== Lightweight interactive falling stars =====
    (() => {
      const canvas = document.getElementById('star-field');
      if (!canvas) return;
      const ctx = canvas.getContext('2d', { alpha: true });
      const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
      let stars = [];
      let running = true;
      let lastFrame = 0;
      const FRAME_MS = 1000 / 30; // 30 FPS is enough for the background and much lighter on Chrome.

      function makeStar(randomY = false) {
        return {
          x: Math.random() * innerWidth,
          y: randomY ? Math.random() * innerHeight : -10 - Math.random() * 55,
          r: .55 + Math.random() * 1.15,
          speed: .90 + Math.random() * 1.35,
          drift: (Math.random() - .5) * .18,
          alpha: .30 + Math.random() * .50
        };
      }

      function resizeStars() {
        // Keep the canvas at CSS-pixel resolution. This avoids multiplying the work on high-DPI screens.
        canvas.width = Math.max(1, innerWidth);
        canvas.height = Math.max(1, innerHeight);
        canvas.style.width = innerWidth + 'px';
        canvas.style.height = innerHeight + 'px';
        const count = Math.max(72, Math.min(140, Math.floor(innerWidth * innerHeight / 12000)));
        stars = Array.from({ length: count }, () => makeStar(true));
      }

      addEventListener('mousemove', e => { pointer.x = e.clientX; pointer.y = e.clientY; }, { passive: true });
      addEventListener('touchmove', e => {
        const t = e.touches && e.touches[0];
        if (t) { pointer.x = t.clientX; pointer.y = t.clientY; }
      }, { passive: true });
      addEventListener('resize', resizeStars, { passive: true });

      document.addEventListener('visibilitychange', () => {
        running = !document.hidden;
        if (running) requestAnimationFrame(frame);
      });

      function frame(ts) {
        if (!running) return;
        if (ts - lastFrame < FRAME_MS) {
          requestAnimationFrame(frame);
          return;
        }
        lastFrame = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const targetPull = (pointer.x - innerWidth / 2) / Math.max(innerWidth / 2, 1);

        for (let i = 0; i < stars.length; i++) {
          const st = stars[i];
          const proximity = 1 - Math.min(1, Math.abs(st.y - pointer.y) / Math.max(innerHeight, 1));
          st.x += st.drift + targetPull * (.25 + proximity * .48) * st.speed;
          st.y += st.speed * (1.02 + proximity * .12);
          if (st.y > innerHeight + 12 || st.x < -25 || st.x > innerWidth + 25) stars[i] = makeStar(false);

          ctx.beginPath();
          ctx.fillStyle = `rgba(255,255,255,${st.alpha})`;
          ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(frame);
      }

      resizeStars();
      requestAnimationFrame(frame);
    })();

  </script>
