    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; background: #050505; }
    body { overflow: hidden; color: #f6f6f6; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }

    .galaxy {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 30%, rgba(126,126,126, .20), transparent 26%),
        radial-gradient(circle at 50% 50%, rgba(108,108,108, .16), transparent 38%),
        radial-gradient(ellipse at center, #0d0d0d 0%, #050505 72%, #020202 100%);
    }

    #starField {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: block;
      pointer-events: none;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 36%, rgba(0,0,0,.20) 68%, rgba(0,0,0,.74) 100%);
    }

    :root {
      --text-soft: rgba(255,255,255,.55);
      --line: rgba(255,255,255,.18);
      --surface: rgba(255,255,255,.045);
      --surface-hover: rgba(255,255,255,.065);
      --kick-green: #53fc18;
    }

    .site-shell {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      padding: 22px 24px 34px;
    }

    .top-nav {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .categories {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 48px;
    }

    .category {
      position: relative;
      color: rgba(255,255,255,.74);
      text-decoration: none;
      text-transform: none;
      text-align: center;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.01em;
      padding: 0 0 14px;
      transition: color .25s ease, transform .25s ease;
    }

    .category::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 24px;
      height: 3px;
      border-radius: 999px;
      background: #ffffff;
      transform: translateX(-50%) scaleX(0);
      opacity: .95;
      transition: transform .25s ease;
    }

    .category:hover { color: #fff; transform: translateY(-1px); }
    .category.active { color: #fff; }
    .category.active::after { transform: translateX(-50%) scaleX(1); }

    .top-divider {
      width: min(1120px, calc(100% - 16px));
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.30), transparent);
      opacity: .75;
    }

    .content {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: clamp(24px, 4vh, 44px);
      pointer-events: none;
    }

    .home-stack {
      width: min(430px, 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      pointer-events: auto;
    }

    .avatar-frame {
      width: 134px;
      height: 134px;
      padding: 4px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035));
      box-shadow: 0 16px 42px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .avatar-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .social-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .links-title {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: "Barlow Condensed", Inter, sans-serif;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.4;
      letter-spacing: .16em;
      color: rgba(255,255,255,.88);
      text-align: center;
    }
    .links-title::before, .links-title::after {
      content: "";
      width: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35));
    }
    .links-title::after { transform: scaleX(-1); }

    .social-card {
      position: relative;
      width: 100%;
      min-height: 72px;
      padding: 12px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.026));
      box-shadow: 0 14px 36px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.05);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-decoration: none;
      color: #fff;
      display: flex;
      align-items: center;
      direction: ltr;
      overflow: hidden;
      isolation: isolate;
      transition: border-color .24s ease, background .24s ease, box-shadow .24s ease;
    }

    /* A travelling highlight traces the edge for as long as the link is hovered. */
    .social-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(108deg, transparent 32%, rgba(167,167,167,.55) 43%, rgba(255,255,255,.95) 50%, rgba(202,202,202,.62) 57%, transparent 68%);
      background-size: 260% 100%;
      background-position: 180% 0;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      opacity: 0;
      pointer-events: none;
      transition: opacity .22s ease;
      animation: link-frame-flow 2.2s linear infinite paused;
    }
    .social-card:hover, .social-card:focus-visible {
      border-color: rgba(255,255,255,.24);
      background: linear-gradient(180deg, rgba(255,255,255,.072), rgba(255,255,255,.035));
      box-shadow: 0 16px 40px rgba(0,0,0,.27), 0 0 22px rgba(157,157,157,.10);
    }
    .social-card:hover::before, .social-card:focus-visible::before {
      opacity: 1;
      animation-play-state: running;
    }
    .social-card:focus-visible { outline: 2px solid rgba(206,206,206,.85); outline-offset: 4px; }
    @keyframes link-frame-flow {
      from { background-position: 180% 0; }
      to { background-position: -180% 0; }
    }

    .social-main {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: row-reverse;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-width: 0;
      width: 100%;
    }
    .social-logo {
      width: 64px;
      height: 46px;
      flex: 0 0 64px;
      display: grid;
      place-items: center;
    }
    .social-logo img { display: block; width: 34px; height: 34px; object-fit: contain; }
    .logo-kick img { width: 60px; height: 20px; }
    .logo-discord img { width: 36px; height: 27px; }
    .logo-youtube img { width: 52px; height: 44.5px; }
    .social-name {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
      font-family: "Barlow Condensed", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -.035em;
      color: #fff;
      text-align: left;
    }

    .kick-status {
      display: inline-block;
      flex: 0 0 8px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #7e7e7e;
      border: 2px solid rgba(10,10,10,.92);
      box-sizing: content-box;
      box-shadow: 0 0 0 1px rgba(255,255,255,.05);
      transition: background .25s ease, box-shadow .25s ease;
      z-index: 2;
    }

    .kick-status.live {
      background: var(--kick-green);
      box-shadow: 0 0 0 1px rgba(83,252,24,.20), 0 0 14px rgba(83,252,24,.72);
      animation: liveHop 3.8s ease-in-out infinite;
    }

    @keyframes liveHop {
      0%, 78%, 100% { transform: translateY(0) scale(1); }
      84% { transform: translateY(-4px) scale(1.08); }
      89% { transform: translateY(0) scale(.98); }
      93% { transform: translateY(-2px) scale(1.04); }
      97% { transform: translateY(0) scale(1); }
    }

    @media (max-width: 640px) {
      body { overflow-y: auto; }
      .site-shell { min-height: 100vh; padding: 20px 14px 24px; }
      .content { align-items: flex-start; padding-top: 16px; padding-bottom: 24px; }
      .home-stack { width: min(390px, 100%); }
      .avatar-frame { width: 116px; height: 116px; }
      .social-card { min-height: 68px; padding: 10px 16px; border-radius: 15px; }
      .social-logo { width: 60px; height: 44.5px; flex-basis: 60px; }
      .social-name { font-size: 22px; }
      .links-title { font-size: 14px; letter-spacing: .14em; }
    }

    
  </style>
<style id="source-journey">
    html, body { height: 100%; overflow: hidden; }
    .journey-galaxy {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .28s ease;
      background: radial-gradient(ellipse at center, #060606 0%, #010101 72%, #000000 100%);
    }
    .journey-galaxy.show { opacity: 1; }
    .galaxy { opacity: 0; transition: opacity .78s ease; }
    .galaxy.show { opacity: 1; }
    .intro-void {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 1;
      pointer-events: none;
      transition: opacity .28s ease;
      background:
        radial-gradient(circle at 50% 46%, rgba(76,76,76,.17), transparent 28%),
        radial-gradient(circle at center, #0e0e0e 0%, #050505 56%, #020202 100%);
    }
    .intro-void.hide { opacity: 0; }
    #scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 0 7px rgba(154,154,154,.52)) drop-shadow(0 0 20px rgba(120,120,120,.30));
    }
    #scene.is-complete { visibility: hidden; }
    .vignette { z-index: 6; }
    .home-stage {
      position: fixed;
      inset: 0;
      z-index: 10;
      overflow-x: hidden;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .72s ease;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.25) transparent;
    }
    .home-stage.is-visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .home-stage .site-shell {
      transform: translateY(12px);
      transition: transform .72s cubic-bezier(.2,.7,.2,1);
    }
    .home-stage.is-visible .site-shell { transform: translateY(0); }

<style id="moving-divider">.top-divider { position: relative; overflow: hidden; }
.top-divider::before, .top-divider::after {
  content: ""; position: absolute; top: 0; height: 1px; width: 14%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
  animation: divider-outward 4.2s linear infinite;
}
.top-divider::before { left: 50%; }
.top-divider::after { right: 50%; animation-name: divider-outward-left; }
@keyframes divider-outward { from { transform: translateX(-50%); opacity: 0; } 15%, 70% { opacity: .75; } to { transform: translateX(380%); opacity: 0; } }
@keyframes divider-outward-left { from { transform: translateX(50%); opacity: 0; } 15%, 70% { opacity: .75; } to { transform: translateX(-380%); opacity: 0; } }
